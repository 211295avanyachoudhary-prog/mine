x-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bgc) var(--bgi);background-size:var(--bgz);background-attachment:var(--bga);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
h1,h2,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.wrap{max-width:900px;margin:auto;padding:16px}
.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--pn);border-radius:20px;padding:14px 16px}
.lvl{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;background:conic-gradient(var(--xp) var(--p),var(--ln2) 0);position:relative;flex:none}
.lvl::after{content:"";position:absolute;inset:6px;background:var(--pn);border-radius:50%}
.lvl span{position:relative;z-index:1}
.grow{flex:1;min-width:180px}
.bar{height:10px;background:var(--ln2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),var(--P));border-radius:9px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.stat{text-align:center;padding:0 8px}.stat b{display:block;font-size:22px}.stat small{color:var(--mu)}
.tutor{display:flex;gap:12px;margin:14px 0;background:var(--pn2);border-radius:20px;padding:14px;align-items:flex-start}
.bot{font-size:38px;animation:bob 3s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.say{min-height:44px}.say:after{content:"▍";animation:bl 1s steps(2) infinite;color:var(--xp)}
@keyframes bl{50%{opacity:0}}
.btn{background:var(--xp);color:var(--onx);border:0;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;margin-top:8px;transition:transform .15s}
.btn:hover{transform:scale(1.05)}.btn.g{background:var(--ln2);color:var(--tx)}
.days{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin}
.day{flex:none;width:58px;text-align:center;background:var(--pn);border:2px solid transparent;border-radius:14px;padding:8px 0;cursor:pointer;color:var(--tx);font:inherit;position:relative}
.day small{display:block;color:var(--mu)}.day b{font-size:18px}
.day.sel{border-color:var(--xp);transform:translateY(-3px)}
.day.full{background:var(--fu)}.day.full:after{content:"⭐";position:absolute;top:-6px;right:-4px;font-size:13px}
.day.now small{color:var(--S)}
h2{font-size:22px;margin:8px 0}
.blk{display:flex;gap:12px;align-items:center;background:var(--pn);border-left:5px solid var(--c);border-radius:14px;padding:11px 14px;margin:8px 0;cursor:pointer;transition:transform .2s,background .3s;width:100%;color:var(--tx);text-align:left;font:inherit;border-top:0;border-right:0;border-bottom:0}
.blk:hover{transform:translateX(5px);background:var(--pn2)}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--c);flex:none;display:grid;place-items:center;font-size:16px;transition:.3s}
.blk.done .ck{background:var(--c);color:var(--in);transform:rotate(360deg)}
.blk.done .tt{text-decoration:line-through;opacity:.55}
.tm{color:var(--mu);font-size:12px}.tt{font-weight:600}.xpv{margin-left:auto;color:var(--xp);font-weight:700;font-size:13px;white-space:nowrap}
.sec,h2{display:inline-block;background:var(--pn);padding:4px 12px;border-radius:10px}.sec{color:var(--mu);margin:18px 0 6px;font-size:13px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.ring{background:var(--pn);border-radius:16px;padding:12px;text-align:center}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .fg{transition:stroke-dashoffset 1s}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{background:var(--pn);border-radius:14px;padding:10px;text-align:center;filter:grayscale(1);opacity:.45;transition:.5s}
.badge.on{filter:none;opacity:1;box-shadow:0 0 18px color-mix(in srgb,var(--xp) 33%,transparent)}.badge span{font-size:28px;display:block}.badge small{color:var(--mu)}
.cf{position:fixed;width:9px;height:9px;pointer-events:none;z-index:9;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(720deg);opacity:0}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--xp);color:var(--onx);padding:10px 18px;border-radius:14px;font-weight:800;z-index:10;transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.clk b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:26px;color:var(--S);text-shadow:0 0 14px #ffc85766}
.clk em{font-style:normal;font-size:14px;color:var(--mu);animation:bl 1s steps(2) infinite}
.sp{border-radius:16px;overflow:hidden;background:var(--pn);padding:8px}
.lk{display:flex;flex-wrap:wrap;background:var(--pn);border-radius:16px;overflow:hidden}.lk a{flex:1 1 220px;display:flex;gap:12px;align-items:center;padding:14px 16px;color:var(--tx);text-decoration:none;transition:background .2s}.lk a+a{border-left:1px solid var(--ln2)}.lk a:hover{background:var(--pn2)}.lk a div b{color:var(--c)}.lk span{font-size:30px}.lk small{display:block;color:var(--mu)}@media(max-width:520px){.lk a+a{border-left:0;border-top:1px solid var(--ln2)}}
.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sp{border-radius:16px;overflow:hidden;background:var(--pn);padding:8px}.sp iframe{display:block}
#fsb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(145deg,#a3a9bf,#4b5068);color:#fff;font:800 24px 'Bricolage Grotesque',system-ui,sans-serif;cursor:pointer;z-index:20;box-shadow:0 6px 24px #000a;animation:fsp 2.4s infinite;transition:transform .2s}
#fsb:hover{transform:scale(1.08)}
@keyframes fsp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--xp) 60%,transparent)}70%,100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--xp) 0%,transparent)}}
#fsb i{position:absolute;top:0;right:0;min-width:20px;height:20px;border-radius:10px;background:#ff5d73;font:700 12px/20px system-ui,sans-serif;font-style:normal;display:none}
#fsp{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(540px,calc(100dvh - 130px));background:var(--fp);border:1px solid var(--ln2);border-radius:22px;z-index:20;display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.95);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,1.2,.4,1);transform-origin:bottom right;color:var(--tx)}
#fsp.open{transform:none;opacity:1;pointer-events:auto}
.fh{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pn);border-bottom:1px solid var(--ln2)}
.fav{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#a3a9bf,#4b5068);display:grid;place-items:center;font-weight:800;flex:none}
.fh b{display:block;line-height:1.2}.fh small{color:var(--B);font-size:12px}
.fh button{margin-left:auto;background:none;border:0;color:var(--mu);font-size:13px;cursor:pointer}.fh button+button{margin-left:0;font-size:18px}
#fsm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.fm{max-width:82%;padding:9px 14px;border-radius:18px;animation:fin .3s;overflow-wrap:anywhere;line-height:1.4}
.fm.f{background:var(--bub);align-self:flex-start;border-bottom-left-radius:6px}
.fm.u{background:var(--xp);color:var(--onx);align-self:flex-end;border-bottom-right-radius:6px;font-weight:600}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.fm.ty{display:flex;gap:4px;padding:13px 16px}.fm.ty s{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:fd 1s infinite}
.fm.ty s:nth-child(2){animation-delay:.15s}.fm.ty s:nth-child(3){animation-delay:.3s}
@keyframes fd{50%{transform:translateY(-5px);background:var(--tx)}}
#fsc{display:flex;gap:6px;overflow-x:auto;padding:6px 12px}
#fsc button{flex:none;background:var(--pn2);color:var(--tx);border:1px solid var(--ln2);border-radius:14px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
#fsc button:hover{border-color:var(--xp)}
.fi{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--pn)}
.fi input{flex:1;min-width:0;background:var(--in);border:1px solid var(--ln2);border-radius:16px;color:var(--tx);padding:10px 14px;font-size:16px;outline:0}
.fi input:focus{border-color:var(--xp)}
.fi button{border:0;border-radius:50%;width:42px;height:42px;background:var(--xp);color:var(--onx);font-size:18px;font-weight:800;cursor:pointer}

#dtutor .serif,#dtutor h1,#dtutor h2,#dtutor h3{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:700;margin:0}#dtutor #nav{display:flex;gap:2px;overflow-x:auto}#dtutor #nav button{background:none;border:0;color:var(--mu);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}#dtutor #nav button.on{color:var(--cr);border-color:var(--go)}#dtutor .card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}#dtutor .card h2{font-size:22px;color:var(--go);margin-bottom:6px}#dtutor .mu{color:var(--mu)}#dtutor button.g,#dtutor .chip{background:var(--pn2);color:var(--cr);border:1px solid var(--ln);border-radius:12px;padding:7px 12px;font:inherit;cursor:pointer}#dtutor button.g:hover,#dtutor .chip:hover{border-color:var(--go)}#dtutor button.p{background:var(--go);color:var(--onx);border:0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}#dtutor input,#dtutor select,#dtutor textarea{background:var(--in);border:1px solid var(--ln);border-radius:10px;color:var(--cr);padding:8px 10px;font:inherit;font-size:16px;max-width:100%}#dtutor input:focus,#dtutor textarea:focus{outline:0;border-color:var(--go)}#dtutor .ch{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}#dtutor .av{width:40px;height:40px;border-radius:50%;background:var(--go);color:var(--onx);display:grid;place-items:center;font:700 22px 'Bricolage Grotesque',Georgia,serif;flex:none}#dtutor #msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}#dtutor .row{display:flex;gap:8px;align-items:flex-end;animation:in .3s}#dtutor .row.u{justify-content:flex-end}#dtutor .row .av{width:30px;height:30px;font-size:16px}#dtutor .b{max-width:84%;padding:9px 14px;border-radius:18px;overflow-wrap:anywhere}#dtutor .t .b{background:var(--pn2);border-bottom-left-radius:5px}#dtutor .u .b{background:var(--go);color:var(--onx);border-bottom-right-radius:5px}@keyframes in{from{opacity:0;transform:translateY(6px)}}#dtutor .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#dtutor .ev{background:var(--pn);border:1px solid var(--go);border-radius:16px;padding:14px;animation:in .3s}#dtutor .evh{font-size:21px;color:var(--go);margin-bottom:8px}#dtutor .er{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-bottom:1px solid var(--ln)}#dtutor .es{font-weight:700;color:var(--go)}#dtutor .es.na{color:var(--mu)}#dtutor .ed{grid-column:1/-1;color:var(--mu);font-size:13px}#dtutor .tot{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 0 8px}#dtutor .tot span{color:var(--mu);font-size:12px;letter-spacing:.1em}#dtutor .tot b{font-size:32px;color:var(--cr)}#dtutor .tot em{font-style:normal;color:var(--go);font-size:20px;font-weight:700}#dtutor .calc{background:var(--in);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;color:var(--mu)}#dtutor .calc div{padding:2px 0}#dtutor #inp{display:flex;gap:8px;padding:10px 0 12px}#dtutor #inp textarea{flex:1;resize:none;height:46px}#dtutor .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}#dtutor .rg{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--go) calc(var(--p)*1%),var(--pn2) 0);display:grid;place-items:center;position:relative;flex:none}#dtutor .rg:after{content:"";position:absolute;inset:9px;background:var(--pn);border-radius:50%}#dtutor .rg b{position:relative;z-index:1;font-size:22px}#dtutor table{width:100%;border-collapse:collapse}#dtutor td,#dtutor th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:left}#dtutor tr.h{cursor:pointer}#dtutor tr.h:hover{background:var(--pn2)}#dtutor .bar{height:9px;background:var(--pn2);border-radius:6px;overflow:hidden;margin:3px 0 9px}#dtutor .bar i{display:block;height:100%;background:var(--go)}#dtutor label.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}#dtutor label.f input: /* ===== Theme + ambient panel ===== */
.amb{background:var(--pn);border-radius:20px;padding:12px 14px;margin:14px 0 0}
.arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.al{color:var(--mu);font-size:13px;font-weight:700;flex:none}
.thm{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:3px 2px;scrollbar-width:thin}
.thm button{flex:none;display:flex;align-items:center;gap:7px;background:var(--pn2);color:var(--mu);border:2px solid transparent;border-radius:12px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.thm button:hover{color:var(--tx)}.thm button.on{color:var(--tx);border-color:var(--xp)}
.thm i{width:14px;height:14px;border-radius:50%;border:1px solid #8888}
#ambc{color:var(--xp)}#ambh{color:var(--mu)}
#ambp{margin-top:12px;border-top:1px solid var(--ln2);padding-top:12px}
#ambp[hidden],#ambh[hidden]{display:none}
.mst{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.mst input{flex:1;min-width:120px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.snd{display:flex;gap:10px;align-items:center;background:var(--pn2);border:2px solid transparent;border-radius:14px;padding:8px 10px;transition:border-color .2s}
.snd.on{border-color:var(--xp)}
.sb{width:34px;height:34px;border-radius:50%;border:0;background:var(--xp);color:var(--onx);font-weight:800;font-size:12px;cursor:pointer;flex:none;transition:transform .15s}
.sb:hover{transform:scale(1.08)}.snd:not(.on) .sb{background:var(--ln2);color:var(--tx)}
.sn{flex:1;min-width:0}.sn span{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn input{width:100%;margin:3px 0 0}
.amb input[type=range]{accent-color:var(--xp);cursor:pointer}
.amb button:focus-visible,.amb input:focus-visible{outline:2px solid var(--xp);outline-offset:2px}

function evHTML(ev,date){return`<div class="evh serif">${fdate(date)} — Daily Evaluation</div>`+ev.rows.map(r=>`<div class="er"><div>${r.ic} ${esc(r.name)}</div><div class="es ${r.na?"na":""}">${r.na?"N/A":r.score+"/10"}</div><div class="ed">${r.na?"":`Target: ${esc(r.t)} · Actual: ${esc(r.a)}<br>`}${esc(r.reason)}</div></div>`).join("")+`<div class="tot"><span>DAILY SCORE</span><b class="serif">${ev.total} / ${ev.max}</b><em>${ev.pct}%</em></div><button class="g" data-act="why">Why did I get this score?</button><div class="calc" hidden>${ev.rows.map(r=>`<div>${r.ic} <b>${esc(r.name)}</b>: ${esc(r.calc)}</div>`).join("")}<div style="margin-top:6px"><b>Total</b>: ${ev.rows.filter(r=>!r.na).map(r=>r.score).join(" + ")||0} = ${ev.total}; maximum = ${ev.rows.filter(r=>!r.na).length} × 10 = ${ev.max}; ${ev.total} ÷ ${ev.max} × 100 = ${ev.pct}%</div></div>`}
function paintChat(){const el=$("#msgs");if(!el)return;const last=D.chat.length-1;
 el.innerHTML=D.chat.map((m,i)=>m.ev?`<div class="ev">${evHTML(m.ev,m.date)}</div>`:m.r==="u"?`<div class="row u"><div class="b">${esc(m.text).replace(/\n/g,"<br>")}</div></div>`:`<div class="row t"><div class="av"></div><div class="b">${esc(m.text).replace(/\n/g,"<br>")}${i===last&&m.chips?`<div class="chips">${m.chips.map(c=>`<button class="chip" data-act="chip" data-a="${esc(c.a)}">${esc(c.l)}</button>`).join("")}</div>`:""}</div></div>`).join("");
 el.scrollTop=el.scrollHeight}
function vChat(){const m=$("#v");m.className="chat";
 m.innerHTML=`<div class="ch"><div class="av"></div><div><div class="serif" style="font-size:20px">${esc(D.cfg.tutor)}</div><div class="mu" style="font-size:12px">Your tutor · strict but fair</div></div><span style="flex:1"></span><input type="date" id="dp" value="${D.active||iso(new Date())}"><button class="g" data-act="setdate">Set date</button></div><div id="msgs"></div>
 <div class="chips" style="margin-bottom:6px"><button class="chip" data-act="sample">Try an example report</button></div>
 <div id="inp"><textarea id="ta" placeholder="Report your day honestly..." rows="1"></textarea><button class="p" type="button" id="tsend">Send</button></div>`;
 if(!D.chat.length)say(`Good morning. Enter today's date so we can begin. Then report your day honestly.`,{chips:[{l:"Use today: "+fdate(iso(new Date())),a:"date:"+iso(new Date())}]});else paintChat();
 const ta=$("#ta"),sendIt=()=>{const t=ta.value.trim();if(t){ta.value="";onUser(t)}};$("#tsend").onclick=sendIt;ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendIt()}}}
function vToday(){const d=D.active||iso(new Date()),day=getDay(d),ds=defs(D.cfg),ev=day.eval,rep=ds.filter(c=>!isNA(c,day.plan)&&getF(day.f,c.id)!==undefined).map(c=>scoreCat(c,day.f,day.plan,day.cfgSnap||D.cfg)),tot=n2(rep.reduce((a,r)=>a+r.score,0)),pct=ev?ev.pct:rep.length?Math.round(tot/(rep.length*10)*100):0,rem=missing(day,D.cfg);
 return`<div class="card"><h2>${fdate(d)}</h2><div class="ch"><div class="rg" style="--p:${pct}"><b class="serif">${pct}%</b></div><div><div class="serif" style="font-size:26px">${ev?ev.total+" / "+ev.max:tot+" / "+rep.length*10}</div><div class="mu">${ev?"Final score for the day":"Score so far (reported categories)"}</div></div></div></div>
 <div class="card"><h2>Today's plan</h2><div class="mu" style="font-size:13px">Untick a subject when nothing is scheduled: it becomes N/A, never 0.</div>
 ${D.cfg.subjects.map(s=>{const p=day.plan.subjects[s]||{on:true,task:""};return`<div class="pl"><label><input type="checkbox" data-pl="on" data-s="${esc(s)}" ${p.on?"checked":""}> ${esc(s)}</label><input data-pl="task" data-s="${esc(s)}" value="${esc(p.task)}" placeholder="${p.on?"e.g. Lecture + 30 PYQs":"Not scheduled (N/A)"}"></div>`}).join("")}
 <div class="pl"><label><input type="checkbox" data-pl="rest" ${day.plan.rest?"checked":""}> Exercise rest day (N/A)</label><span></span></div></div>
 <div class="card"><h2>Habits</h2>${ds.map(c=>{const na=isNA(c,day.plan),v=getF(day.f,c.id),r=v!==undefined&&!na?scoreCat(c,day.f,day.plan,day.cfgSnap||D.cfg):null;return`<div class="er"><div>${c.ic} ${esc(c.name)}</div><div class="es ${na?"na":""}">${na?"N/A":r?r.score+"/10":"remaining"}</div></div>`}).join("")}
 ${rem.length?`<p class="mu">Still to report: ${rem.map(c=>c.name).join(", ")}.</p>`:""}</div>`}
function vHistory(){const ds=evDays().reverse();if(!ds.length)return`<div class="card"><h2>History</h2><p class="mu">No evaluated days yet. Report a day in the chat.</p></div>`;
 const s=hsel&&D.days[hsel]&&D.days[hsel].eval?hsel:null;
 return`<div class="card"><h2>History</h2><table><tr><th>Date</th><th>Score</th><th>%</th></tr>${ds.map(x=>`<tr class="h" data-act="open" data-d="${x.date}"><td>${sdate(x.date)}</td><td>${x.ev.total}/${x.ev.max}</td><td>${x.ev.pct}%</td></tr>`).join("")}</table></div>${s?`<div class="ev">${evHTML(D.days[s].eval,s)}</div>`:`<p class="mu">Click a day to open its full report.</p>`}`}
function vStats(){const ds=evDays();if(!ds.length)return`<div class="card"><h2>Analytics</h2><p class="mu">Charts appear after your first evaluated day.</p></div>`;
 const wk=k=>{const x=dd(k),o=(x.getDay()+6)%7;x.setDate(x.getDate()-o);return iso(x)},grp=f=>{const g={};ds.forEach(x=>(g[f(x.date)]=g[f(x.date)]||[]).push(x.ev.pct));return Object.entries(g).sort().slice(-6).reverse()};
 const con={};ds.forEach(x=>x.ev.rows.forEach(r=>{if(r.na)return;const c=con[r.id]=con[r.id]||{n:r.name,m:0,t:0};c.t++;if(met(r))c.m++}));
 const study=Object.entries(con).filter(([k])=>k.startsWith("sub:")).reduce((a,[k,c])=>({m:a.m+c.m,t:a.t+c.t}),{m:0,t:0});
 const cb=(n,m,t)=>`<div>${esc(n)} <span class="mu">${t?Math.round(m/t*100):0}% (${m}/${t} days)</span></div><div class="bar"><i style="width:${t?m/t*100:0}%"></i></div>`;
 return`<div class="card"><h2>Daily score (last 14 days)</h2>${bars(ds.slice(-14).map(x=>({l:sdate(x.date),v:x.ev.pct})))}</div>
 <div class="two"><div class="card"><h2>Weekly average</h2>${grp(wk).map(([k,a])=>`<div>Week of ${sdate(k)}: <b>${avg(a)}%</b></div>`).join("")}</div><div class="card"><h2>Monthly average</h2>${grp(k=>k.slice(0,7)).map(([k,a])=>`<div>${dd(k+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"})}: <b>${avg(a)}%</b></div>`).join("")}</div></div>
 <div class="card"><h2>Consistency</h2><div class="mu" style="font-size:13px">A day counts when the category scored at least ${Math.round(D.cfg.met*100)}%. N/A days are ignored.</div>${cb("Study (all subjects)",study.m,study.t)}${Object.entries(con).filter(([k])=>!k.startsWith("sub:")).map(([k,c])=>cb(c.n,c.m,c.t)).join("")}</div>
 <div class="card"><h2>Streaks</h2><div class="two">${Object.entries(ST).map(([n,p])=>`<div><span class="serif" style="font-size:30px;color:var(--go)">${streak(p)}</span> <span class="mu">${n} streak</span></div>`).join("")}</div><div class="mu" style="font-size:13px">N/A days never break a streak; a missed report day does.</div></div>`}
function vSet(){const c=D.cfg,I=(k,l,t,v,x="")=>`<label class="f">${l}<input type="${t}" data-c="${k}" value="${esc(v)}" ${x}></label>`;
 return`<div class="card"><h2>Tutor</h2>${I("tutor","Tutor name","text",c.tutor)}<label class="f">Personality<select data-c="level">${["Gentle","Balanced","Strict"].map((x,i)=>`<option value="${i+1}" ${c.level==i+1?"selected":""}>${x}</option>`).join("")}</select></label></div>
 <div class="card"><h2>Targets</h2>${I("wake","Wake-up target","time",c.wake)}${I("wakePen","Points lost per 30 min late","number",c.wakePen,'step="0.25" min="0"')}${I("sleep","Sleep target (hours)","number",c.sleep,'step="0.5" min="1"')}${I("water","Water target (glasses)","number",c.water,'min="1"')}${I("ex","Exercise target (min)","number",c.ex,'min="1"')}${I("steps.am","Morning skincare steps","number",c.steps.am,'min="1"')}${I("steps.pm","Night skincare steps","number",c.steps.pm,'min="1"')}${I("met","Streak / consistency threshold (0-1)","number",c.met,'step="0.05" min="0" max="1"')}</div>
 <div class="card"><h2>Subjects &amp; categories</h2>${I("subjects","Subjects (comma separated)","text",c.subjects.join(", "))}<div class="mu" style="font-size:13px;margin:6px 0">Active categories:</div>${defs({...c,off:{}}).map(x=>`<label class="f">${x.ic} ${esc(x.name)}<input type="checkbox" data-off="${esc(x.id)}" ${c.off[x.id]?"":"checked"}></label>`).join("")}</div>
 <div class="card"><h2>Data</h2><p class="mu" style="font-size:13px">Changing targets never alters past scores. Use the button below only if you want history rescored with today's rules.</p><button class="g" data-act="recalc">Recalculate history</button> <button class="g" data-act="reset">Reset all data</button>
 <p class="mu" style="font-size:13px">Backup (copy this text) / restore (paste, then Import):</p><textarea id="bk" rows="4" style="width:100%">${esc(JSON.stringify(D))}</textarea><button class="g" data-act="import" style="margin-top:6px">Import</button></div>`}
function go(v){view=v;$("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===v?"on":""}" data-go="${k}">${l}</button>`).join("");const m=$("#v");m.className="";
 if(v==="chat")return vChat();m.innerHTML={today:vToday,history:vHistory,stats:vStats,set:vSet}[v]();m.scrollTop=0}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="chip")act(b.dataset.a);
 if(a==="why"){const c=b.nextElementSibling;c.hidden=!c.hidden}
 if(a==="sample"){$("#ta").value=SAMPLE;$("#ta").focus()}
 if(a==="setdate"){const v=$("#dp").value;if(v)setDay(v)}
 if(a==="open"){hsel=b.dataset.d;go("history")}
 if(a==="recalc"){if(!armed.r){armed.r=1;b.textContent="Click again to rescore ALL history";return}armed={};Object.values(D.days).forEach(x=>{if(x.eval&&!missing(x,D.cfg).length){x.cfgSnap=clone(D.cfg);x.eval=evalDay(x,x.cfgSnap)}});save();b.textContent="Done"}
 if(a==="reset"){if(!armed.x){armed.x=1;b.textContent="Click again to erase everything";return}D=clone(DEF);save();armed={};go("chat")}
 if(a==="import"){try{const o=JSON.parse($("#bk").value);if(!o.cfg||!o.days)throw 0;D=Object.assign(clone(DEF),o);save();b.textContent="Imported"}catch(x){b.textContent="Invalid data"}}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.pl){const day=getDay(D.active||iso(new Date())),d=D.active||iso(new Date());day.plan.set=true;
  if(t.dataset.pl==="rest")day.plan.rest=t.checked;else if(t.dataset.pl==="on")day.plan.subjects[t.dataset.s].on=t.checked;else day.plan.subjects[t.dataset.s].task=t.value;
  save();reeval(d);return go("today")}
 if(t.dataset.off){D.cfg.off[t.dataset.off]=!t.checked;save();return}
 if(t.dataset.c){const k=t.dataset.c;let v=t.value;
  if(k==="subjects")v=v.split(",").map(s=>s.trim()).filter(Boolean);else if(t.type==="number"||k==="level")v=+v;
  if(k.startsWith("steps."))D.cfg.steps[k.slice(6)]=v;else D.cfg[k]=v;save()}});
setInterval(()=>{const t=iso(new Date());if(D.lastSeen&&D.lastSeen!==t&&D.active===D.lastSeen){say(`It's now ${fdate(t)}. Yesterday's report is saved. Set the new date when you're ready.`,{chips:[{l:"Start "+fdate(t),a:"date:"+t}]})}D.lastSeen=t},30000);
D.lastSeen=iso(new Date());go("chat");

})();
</script><script>
/* Theme selector + ambient sounds (self-contained; does not touch tutor/quest code) */
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Themes ---------- */
const THEMES=[["original","Original","#ece6f7","#a78bfa"],["academia","Dark Academia","#14100c","#c9974a"],["cozy","Cozy Study","#271816","#ff9d6c"],["rainy","Rainy Night","#0b1526","#7aa2ff"],["forest","Forest","#12281a","#6fcf8f"],["library","Library","#2a1b21","#d9a441"],["cafe","Café","#e6d5bf","#8b5a2b"],["sunset","Sunset","#5a1f4a","#ff8a5c"],["minimal","Minimal Light","#f5f6f8","#5b4bd6"]];
const thm=$("#thm");
thm.innerHTML=THEMES.map(t=>`<button data-t="${t[0]}" aria-pressed="false"><i style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></i>${t[1]}</button>`).join("");
let meta=document.querySelector('meta[name=theme-color]');
if(!meta){meta=document.createElement("meta");meta.name="theme-color";document.head.appendChild(meta)}
function setTheme(id,save=true){
 if(!THEMES.some(t=>t[0]===id))id="original";
 document.documentElement.dataset.theme=id;
 thm.querySelectorAll("button").forEach(b=>{const on=b.dataset.t===id;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});
 meta.content=getComputedStyle(document.body).backgroundColor;
 if(save)try{localStorage.setItem("sq_theme",id)}catch(e){}
}
thm.addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTheme(b.dataset.t)});
setTheme(document.documentElement.dataset.theme||"original",false);

/* ---------- Ambient sounds (Web Audio, synthesized: no files, no network) ---------- */
const SOUNDS=[
 {id:"music",n:"Background music",i:"🎵",b:.55},
 {id:"fire",n:"Fireplace",i:"🔥",b:.6},
 {id:"birds",n:"Birds chirping",i:"🐦",b:.5},
 {id:"rain",n:"Rain",i:"🌧️",b:.5},
 {id:"thunder",n:"Thunder",i:"⛈️",b:.9},
 {id:"crickets",n:"Crickets",i:"🦗",b:.3},
 {id:"river",n:"Flowing water",i:"🌊",b:.6},
 {id:"brown",n:"Brown noise",i:"🟤",b:.35},
 {id:"white",n:"White noise",i:"⚪",b:.16}
];
const AK="sq_amb";
const S=Object.assign({master:70,open:false,s:{}},store.get(AK,{}));
SOUNDS.forEach(x=>{const c=S.s[x.id]||(S.s[x.id]={});c.on=!!c.on;c.vol=Number.isFinite(c.vol)?c.vol:50});
const save=()=>store.set(AK,S);

let ctx,master,bufs={};
const R={}; // running sounds
const lvl=x=>Math.pow(S.s[x.id].vol/100,2)*x.b;
const mlvl=()=>Math.pow(S.master/100,2);

function init(){
 if(ctx){if(ctx.state==="suspended")ctx.resume();return true}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
 ctx=new AC();master=ctx.createGain();master.gain.value=mlvl();
 const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);return true;
}
function nbuf(type){
 if(bufs[type])return bufs[type];
 const sr=ctx.sampleRate,N=sr*6|0,F=sr*.25|0,d=new Float32Array(N+F);
 if(type==="white")for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 else{let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}}
 const b=ctx.createBuffer(1,N,sr),o=b.getChannelData(0);
 for(let i=0;i<N;i++)o[i]=d[i];
 for(let i=0;i<F;i++){const k=i/F;o[i]=d[i]*k+d[N+i]*(1-k)} // seamless loop
 return bufs[type]=b;
}

function build(id,out){
 const nodes=[],timers=[];let dead=false;
 const src=t=>{const s=ctx.createBufferSource();s.buffer=nbuf(t);s.loop=true;s.start(0,Math.random()*4);nodes.push(s);return s};
 const osc=(type,f)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f;o.start();nodes.push(o);return o};
 const flt=(type,f,q=.7)=>{const x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x};
 const gn=v=>{const g=ctx.createGain();g.gain.value=v;return g};
 const every=(fn,min,max,first)=>{let t;const run=()=>{if(dead)return;fn();t=setTimeout(run,(min+Math.random()*(max-min))*1000)};
  t=setTimeout(run,(first??(1+Math.random()*min*.5))*1000);timers.push(()=>clearTimeout(t))};
 const shot=(type,dest,f,q,dur,v,ft)=>{const t0=ctx.currentTime,s=ctx.createBufferSource();s.buffer=nbuf(type);
  const bp=flt(ft||"bandpass",f,q),g=gn(0);s.connect(bp);bp.connect(g);g.connect(dest);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.start(t0,Math.random()*4);s.stop(t0+dur+.05)};
 const pan=dest=>{if(!ctx.createStereoPanner)return dest;const p=ctx.createStereoPanner();p.pan.value=Math.random()*1.6-.8;p.connect(dest);return p};

 if(id==="white")src("white").connect(out);
 else if(id==="brown")src("brown").connect(out);
 else if(id==="rain"){
  const a=src("white"),hp=flt("highpass",900),lp=flt("lowpass",7500),g=gn(.9);a.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);
  const b=src("white"),bp=flt("bandpass",3200,.5),g2=gn(.35);b.connect(bp);bp.connect(g2);g2.connect(out);
  const l=osc("sine",.13),lg=gn(.12);l.connect(lg);lg.connect(g.gain);
 }
 else if(id==="thunder"){
  every(()=>{
   const t0=ctx.currentTime,dur=4+Math.random()*3,s=ctx.createBufferSource();s.buffer=nbuf("brown");s.loop=true;
   const lp=flt("lowpass",160+Math.random()*140),g=gn(0);s.connect(lp);lp.connect(g);g.connect(out);
   const p=g.gain;p.setValueAtTime(0,t0);p.linearRampToValueAtTime(1.7,t0+.2);p.linearRampToValueAtTime(.6,t0+1);p.linearRampToValueAtTime(1.2,t0+1.6);p.linearRampToValueAtTime(.3,t0+2.8);p.linearRampToValueAtTime(0,t0+dur);
   s.start(t0,Math.random()*4);s.stop(t0+dur+.1);
   shot("white",out,900,.6,.35,.5);
  },8,22,1.2);
 }
 else if(id==="fire"){
  const a=src("brown"),lp=flt("lowpass",420),g=gn(.9);a.connect(lp);lp.connect(g);g.connect(out);
  const crackle=()=>{if(dead)return;shot("white",out,1500+Math.random()*3500,1.2,.03+Math.random()*.06,.15+Math.random()*.6);
   if(Math.random()<.35)setTimeout(crackle,30+Math.random()*70)};
  every(crackle,.08,.55,.1);
 }
 else if(id==="birds"){
  every(()=>{
   const dest=pan(out);let t=ctx.currentTime;const n=2+(Math.random()*4|0),base=2200+Math.random()*2200,sp=.07+Math.random()*.06;
   for(let i=0;i<n;i++){const o=ctx.createOscillator(),g=gn(0),f=base*(1+Math.random()*.35);o.type="sine";
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(Math.random()<.5?1.4:.72),t+sp*.8);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+sp);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+sp+.02);t+=sp*(1.1+Math.random()*.5)}
  },.7,3.6,.3);
 }
 else if(id==="crickets"){
  const lp=flt("lowpass",6500);lp.connect(out);
  for(let i=0;i<3;i++){
   const c=osc("sine",4100+Math.random()*700),a=gn(.1),g2=gn(.06);
   const pu=osc("square",26+Math.random()*8),pf=flt("lowpass",70),pg=gn(.1);pu.connect(pf);pf.connect(pg);pg.connect(a.gain);
   const gt=osc("square",2+Math.random()*.9),gf=flt("lowpass",30),gg=gn(.5),g3=gn(.5);gt.connect(gf);gf.connect(gg);gg.connect(g3.gain);
   c.connect(a);a.connect(g3);g3.connect(g2);g2.connect(lp);
  }
 }
 else if(id==="river"){
  const a=src("brown"),bp=flt("bandpass",520,.5),g=gn(1.1);a.connect(bp);bp.connect(g);g.connect(out);
  const l=osc("sine",.21),lg=gn(160);l.connect(lg);lg.connect(bp.frequency);
  const b=src("white"),hp=flt("highpass",1500),lp=flt("lowpass",5200),g2=gn(.22);b.connect(hp);hp.connect(lp);lp.connect(g2);g2.connect(out);
  const l2=osc("sine",.33),lg2=gn(.08);l2.connect(lg2);lg2.connect(g2.gain);
  every(()=>{const t=ctx.currentTime,o=ctx.createOscillator(),bg=gn(0),f=350+Math.random()*900,d=.05+Math.random()*.08;o.type="sine";
   o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.7,t+d);
   bg.gain.setValueAtTime(0,t);bg.gain.linearRampToValueAtTime(.09,t+.01);bg.gain.exponentialRampToValueAtTime(.001,t+d+.02);
   o.connect(bg);bg.connect(pan(out));o.start(t);o.stop(t+d+.05)},.04,.3,.1);
 }
 else if(id==="music"){
  const bus=gn(1),lp=flt("lowpass",1500),dl=ctx.createDelay(1),fb=gn(.42),wet=gn(.4);
  dl.delayTime.value=.46;bus.connect(lp);lp.connect(out);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
  const mf=m=>440*Math.pow(2,(m-69)/12);
  const chords=[[57,60,64,67],[53,57,60,64],[60,64,67,71],[55,59,62,64]];let ci=0;
  const chord=()=>{const t0=ctx.currentTime;chords[ci++%chords.length].forEach(m=>{[-6,6].forEach(dt=>{
    const o=ctx.createOscillator(),g=gn(0);o.type="triangle";o.frequency.value=mf(m);o.detune.value=dt;
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.07,t0+2.5);g.gain.linearRampToValueAtTime(.05,t0+6);g.gain.linearRampToValueAtTime(0,t0+9.5);
    o.connect(g);g.connect(bus);o.start(t0);o.stop(t0+10)})})};
  chord();every(chord,8,8,8);
  const pent=[69,72,74,76,79,81];
  every(()=>{const t=ctx.currentTime,o=ctx.createOscillator(),g=gn(0);o.type="sine";o.frequency.value=mf(pent[Math.random()*pent.length|0]);
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+3);
   o.connect(g);g.connect(bus);o.start(t);o.stop(t+3.1)},2.5,7,3);
 }
 return()=>{dead=true;timers.forEach(f=>f());nodes.forEach(n=>{try{n.stop()}catch(e){}})};
}

function play(id){
 if(R[id]||!init())return;
 const x=SOUNDS.find(s=>s.id===id),vg=ctx.createGain();vg.gain.value=0;vg.connect(master);
 R[id]={vg,stop:build(id,vg)};vg.gain.setTargetAtTime(lvl(x),ctx.currentTime,.4);
}
function halt(id){
 const r=R[id];if(!r)return;delete R[id];
 r.vg.gain.setTargetAtTime(0,ctx.currentTime,.2);
 setTimeout(()=>{r.stop();r.vg.disconnect()},1200);
}

/* ---------- UI ---------- */
const sg=$("#sg"),ambp=$("#ambp"),ambt=$("#ambt"),amv=$("#amv"),hint=$("#ambh");
sg.innerHTML=SOUNDS.map(x=>`<div class="snd" data-id="${x.id}"><button class="sb" aria-pressed="false" aria-label="Play ${x.n}">▶</button><div class="sn"><span>${x.i} ${x.n}</span><input type="range" min="0" max="100" aria-label="${x.n} volume"></div></div>`).join("");
function paint(){
 let n=0;
 SOUNDS.forEach(x=>{const row=sg.querySelector(`[data-id=${x.id}]`),c=S.s[x.id],b=row.querySelector("button"),r=row.querySelector("input");
  row.classList.toggle("on",c.on);b.textContent=c.on?"❚❚":"▶";b.setAttribute("aria-pressed",c.on);b.setAttribute("aria-label",(c.on?"Pause ":"Play ")+x.n);r.value=c.vol;if(c.on)n++});
 $("#ambc").textContent=n?`· ${n} playing`:"";
 amv.value=S.master;ambp.hidden=!S.open;ambt.setAttribute("aria-expanded",S.open);
}
sg.addEventListener("click",e=>{const b=e.target.closest(".sb");if(!b)return;
 const id=b.parentNode.dataset.id,c=S.s[id];c.on=!c.on;c.on?play(id):halt(id);save();paint()});
sg.addEventListener("input",e=>{const r=e.target;if(r.type!=="range")return;
 const id=r.closest(".snd").dataset.id,x=SOUNDS.find(s=>s.id===id);S.s[id].vol=+r.value;
 if(R[id])R[id].vg.gain.setTargetAtTime(lvl(x),ctx.currentTime,.05);save()});
amv.addEventListener("input",()=>{S.master=+amv.value;if(master)master.gain.setTargetAtTime(mlvl(),ctx.currentTime,.05);save()});
$("#ams").addEventListener("click",()=>{SOUNDS.forEach(x=>{if(S.s[x.id].on){S.s[x.id].on=false;halt(x.id)}});save();paint()});
ambt.addEventListener("click",()=>{S.open=!S.open;save();paint()});
paint();

/* Browsers block audio until a gesture: resume the saved mix on first interaction */
if(SOUNDS.some(x=>S.s[x.id].on)){
 hint.hidden=false;
 const go=()=>{["pointerdown","keydown"].forEach(t=>removeEventListener(t,go,true));hint.hidden=true;
  SOUNDS.forEach(x=>{if(S.s[x.id].on)play(x.id)})};
 ["pointerdown","keydown"].forEach(t=>addEventListener(t,go,true));
}
})();

</script></body></html>
